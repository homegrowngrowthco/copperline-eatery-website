name: Deploy to Netlify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Silence the "Node.js 20 actions deprecated" warning by opting actions/checkout
  # and actions/setup-node into Node 24 now (becomes the default June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@22

      - name: Deploy to Netlify
        run: netlify deploy --dir=dist ${{ github.ref == 'refs/heads/master' && '--prod' || '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Ping IndexNow (prod only)
        if: github.ref == 'refs/heads/master'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "copperlineeatery.com",
              "key": "670b4b1e5abe94d9050c77bc3a1011e2",
              "keyLocation": "https://copperlineeatery.com/670b4b1e5abe94d9050c77bc3a1011e2.txt",
              "urlList": [
                "https://copperlineeatery.com/",
                "https://copperlineeatery.com/menu",
                "https://copperlineeatery.com/catering",
                "https://copperlineeatery.com/contact",
                "https://copperlineeatery.com/about",
                "https://copperlineeatery.com/faq"
              ]
            }')
          echo "IndexNow response: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "Warning: IndexNow returned unexpected status $STATUS"
          fi
