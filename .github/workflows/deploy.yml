name: Deploy to Netlify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@22

      - name: Deploy to Netlify
        run: netlify deploy --dir=dist --functions=netlify/functions ${{ github.ref == 'refs/heads/master' && '--prod' || '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Ping IndexNow (prod only)
        if: github.ref == 'refs/heads/master'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "copperlineeatery.com",
              "key": "670b4b1e5abe94d9050c77bc3a1011e2",
              "keyLocation": "https://copperlineeatery.com/670b4b1e5abe94d9050c77bc3a1011e2.txt",
              "urlList": [
                "https://copperlineeatery.com/",
                "https://copperlineeatery.com/menu",
                "https://copperlineeatery.com/catering",
                "https://copperlineeatery.com/contact",
                "https://copperlineeatery.com/about",
                "https://copperlineeatery.com/faq",
                "https://copperlineeatery.com/catering/western-massachusetts",
                "https://copperlineeatery.com/catering/springfield-ma",
                "https://copperlineeatery.com/catering/holyoke-ma",
                "https://copperlineeatery.com/catering/west-springfield-ma",
                "https://copperlineeatery.com/catering/agawam-ma",
                "https://copperlineeatery.com/catering/westfield-ma",
                "https://copperlineeatery.com/catering/ludlow-ma",
                "https://copperlineeatery.com/catering/south-hadley-ma",
                "https://copperlineeatery.com/catering/granby-ma",
                "https://copperlineeatery.com/catering/easthampton-ma",
                "https://copperlineeatery.com/catering/northampton-ma",
                "https://copperlineeatery.com/catering/longmeadow-ma",
                "https://copperlineeatery.com/catering/east-longmeadow-ma",
                "https://copperlineeatery.com/catering/wilbraham-ma",
                "https://copperlineeatery.com/catering/palmer-ma",
                "https://copperlineeatery.com/catering/belchertown-ma",
                "https://copperlineeatery.com/catering/amherst-ma",
                "https://copperlineeatery.com/catering/hampden-ma",
                "https://copperlineeatery.com/catering/southwick-ma",
                "https://copperlineeatery.com/catering/monson-ma",
                "https://copperlineeatery.com/catering/hadley-ma",
                "https://copperlineeatery.com/catering/enfield-ct",
                "https://copperlineeatery.com/catering/suffield-ct",
                "https://copperlineeatery.com/catering/windsor-locks-ct",
                "https://copperlineeatery.com/catering/east-windsor-ct",
                "https://copperlineeatery.com/catering/somers-ct"
              ]
            }')
          echo "IndexNow response: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "Warning: IndexNow returned unexpected status $STATUS"
          fi
